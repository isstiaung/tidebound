name: Bug report
description: Something in the game doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [The Voyage, Daily Tide, Quick duel, Two players, Title or menus]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15, Chrome on Windows
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the board is often the quickest way to show a rules bug.
