name: CI

# Pull requests only: pushes to main are tested by the deploy workflow,
# and listening to branch pushes too would run every PR check twice.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # includes the TypeScript typecheck
